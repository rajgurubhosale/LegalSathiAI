services:
  backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    ports:
      - "8000:8000"

    env_file: .env

    environment:
      LEGALSAATHI_VECTORSTORE_PATH: /app/vectorstore_octen_1200
    
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      start_period: 5m
    
    volumes:
      - ./vectorstore_octen_1200:/app/vectorstore_octen_1200
      - model-cache:/root/.cache/huggingface
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8501:8501"
    environment:
      LEGALSAATHI_API_URL: http://backend:8000
      
    depends_on:
      backend:
      condition: service_healthy
    restart: unless-stopped

volumes:
  model-cache: