[project]
name = "legal-sathi-ai"
version = "0.0.1"
description = "AI Legal Assistant using RAG"
requires-python = ">=3.12,<3.13"
authors = [{name = "Rajguru Bhosale", email = "bhosalerajguru007@gmail.com"}]
dependencies = [
    "chromadb>=1.5.9",
    "deepeval>=4.2.6",
    "docling>=2.130.0",
    "from-root>=1.3.0",
    "fastapi>=0.115,<1",
    "huggingface-hub>=1.16.1",
    "langchain>=1.4.3",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.5",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.6.6",
    "langchain-pymupdf4llm>=1.28.0",
    "langchain-text-splitters>=1.1.2",
    "marker-pdf>=2.0.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pymupdf>=1.28.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "requests>=2.32,<3",
    "sentence-transformers==6.1.0",
    "streamlit[pdf]>=1.57",
    "tiktoken>=0.14.0",
    "torch",
    "uvicorn>=0.30,<1",
    "psycopg[binary,pool]>=3.3.6",
    "pyjwt>=2.15.1",
    "pwdlib[argon2]>=0.3.1",
    "python-multipart>=0.0.32",
    "pydantic[email]>=2.13.4",
    "langgraph-checkpoint-postgres>=3.1.2",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*", "backend", "backend.*"]
[tool.pyrefly]
search-path = ["."]
python-interpreter-path = ".venv/Scripts/python.exe"
